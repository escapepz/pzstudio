name: Cleanup Stale Workflow Runs

on:
    schedule:
        # Runs weekly on Sunday at midnight UTC
        - cron: '0 0 * * 0'
    workflow_dispatch: # Allows manual trigger from Actions tab

# Deleting workflow runs needs the actions:write scope; declared explicitly
# so the job also works if default GITHUB_TOKEN permissions are read-only.
permissions:
    actions: write

jobs:
    del_runs:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Delete workflow runs
              uses: Mattraks/delete-workflow-runs@v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  retain_days: 14 # Keep runs from the last 14 days
                  keep_minimum_runs: 5 # Keep at least 5 runs per workflow
