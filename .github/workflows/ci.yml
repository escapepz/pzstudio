name: CI

on:
    push:
        # CI runs on development pushes only: <cycle>-dev branches catch
        # breakage early. The merge-only branches (main and the <cycle>
        # verify branches) are verified by the pull_request trigger
        # instead. Old-cycle branches (42.20.x) stay listed for hotfix
        # pushes.
        branches: [42.20.0-dev, 42.21.0-dev, 42.22.0-dev]
    pull_request:
        # Merge-only targets: merging into any of these is what runs CI.
        branches: [main, 42.20.0, 42.21.0, 42.22.0]

# A newer push cancels the older run on the same ref: stacked runs would
# each queue three macOS jobs, and the hosted arm64 pool is tight enough
# that superseded runs were losing runners they never used.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    linux:
        # The gate: one runner that exercises every suite, and only a green
        # gate starts the cross-platform jobs below. 6 of the last 7 CI
        # failures had linux red, so the gate skips the redundant
        # windows/macos runners on a broken commit and reports it in ~3
        # minutes instead of ~7. The known cost: a windows-only regression
        # (rare — the 8.3 short-path pins are the one so far) surfaces one
        # push later than it would ungated.
        name: CI (ubuntu-latest)
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v4
              with:
                  version: 12

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Cache the downloaded VS Code test installation
              uses: actions/cache@v4
              with:
                  path: packages/vscode-extension/.vscode-test
                  key: vscode-test-ubuntu-latest-${{ hashFiles('packages/vscode-extension/.vscode-test.js') }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Build
              # Root build fans out to every package in dependency order
              # (CLI, platform adapters, the extension), so all three suites
              # below can pin against the built dist.
              run: pnpm build

            - name: Test
              run: pnpm test

            - name: Real-environment e2e
              run: pnpm test:real-env

            - name: Desktop integration tests
              # VS Code needs an X server on Linux; Xvfb is preinstalled there.
              run: xvfb-run -a pnpm --filter pzstudio42 test:integration

    cross-platform:
        needs: linux
        name: CI (${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest]

        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive

            - uses: pnpm/action-setup@v4
              with:
                  version: 12

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Exclude the test working set from Windows Defender
              if: runner.os == 'Windows'
              continue-on-error: true
              shell: pwsh
              # The suite does thousands of small temp-file writes; real-time
              # scanning multiplies that cost several-fold on the runners.
              run: |
                  Set-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
                  Set-MpPreference -ExclusionPath "$env:TEMP"
                  Set-MpPreference -ExclusionProcess "node.exe"

            - name: Cache the downloaded VS Code test installation
              uses: actions/cache@v4
              with:
                  path: packages/vscode-extension/.vscode-test
                  key: vscode-test-${{ matrix.os }}-${{ hashFiles('packages/vscode-extension/.vscode-test.js') }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Build
              run: pnpm build

            - name: Test (Windows - sequential files)
              if: runner.os == 'Windows'
              run: pnpm exec vitest run --no-file-parallelism

            - name: Test
              if: runner.os != 'Windows'
              run: pnpm test

            - name: Real-environment e2e
              run: pnpm test:real-env

            - name: Desktop integration tests
              # Windows and macOS run VS Code without an X server; xvfb is
              # only needed on the linux gate above.
              run: pnpm --filter pzstudio42 test:integration
