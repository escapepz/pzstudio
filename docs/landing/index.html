<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>PZ Studio &mdash; Project Zomboid Build 42 modding</title>
        <meta
            name="description"
            content="Create, build and manage Project Zomboid Build 42 mods"
        />

        <style>
            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                font-family:
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    sans-serif;
                background: #f6f7f9;
                color: #1c2430;
                text-align: center;
            }

            main {
                padding: 3rem 1.5rem;
                max-width: 40rem;
            }

            h1 {
                font-size: 2.25rem;
                letter-spacing: -0.02em;
                margin: 0 0 0.5rem;
            }

            .pitch {
                font-size: 1.25rem;
                color: #46536a;
                margin: 0 0 2.5rem;
            }

            .cta-row {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                align-items: center;
            }

            a.cta {
                display: inline-block;
                padding: 0.75rem 1.5rem;
                border-radius: 0.5rem;
                background: #2563eb;
                color: #ffffff;
                font-size: 1rem;
                font-weight: 600;
                text-decoration: none;
            }

            a.cta:hover,
            a.cta:focus-visible {
                background: #1d4ed8;
            }

            .cmd-row {
                display: flex;
                gap: 0.5rem;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;
                margin: 0;
            }

            code {
                font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
                background: #e7eaf0;
                color: #1c2430;
                padding: 0.5rem 0.75rem;
                border-radius: 0.375rem;
                font-size: 0.95rem;
            }

            button.copy {
                padding: 0.5rem 0.9rem;
                border-radius: 0.375rem;
                border: 1px solid #b9c1cf;
                background: #ffffff;
                color: #1c2430;
                font-size: 0.9rem;
                cursor: pointer;
                min-width: 5.5rem;
            }

            button.copy:hover,
            button.copy:focus-visible {
                border-color: #2563eb;
                color: #2563eb;
            }

            .hint {
                color: #64748b;
                font-size: 0.9rem;
                margin: 0.5rem 0 0;
            }

            footer {
                padding: 1.5rem;
                color: #64748b;
                font-size: 0.85rem;
            }

            footer p {
                margin: 0;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>PZ Studio</h1>
            <p class="pitch">
                Create, build and manage Project Zomboid Build 42 mods
            </p>
            <div class="cta-row">
                <a
                    id="cta-marketplace"
                    class="cta"
                    href="https://marketplace.visualstudio.com/items?itemName=escapepz.pzstudio42"
                    target="_blank"
                    rel="noopener noreferrer"
                    >Install from the VS Code Marketplace</a
                >
                <p class="cmd-row">
                    <code>npm i @pzstudio/cli</code>
                    <button
                        id="cta-npm"
                        class="copy"
                        type="button"
                        aria-label="Copy the npm install command"
                    >
                        Copy
                    </button>
                </p>
                <p class="cmd-row">
                    <code>npx @pzstudio/cli --help</code>
                    <button
                        id="cta-npx"
                        class="copy"
                        type="button"
                        aria-label="Copy the npx preview command"
                    >
                        Copy
                    </button>
                </p>
                <p class="hint">
                    The VS Code extension includes the CLI &mdash; one install
                    is enough.
                </p>
            </div>
        </main>
        <footer>
            <p>Requires Project Zomboid Build 42.</p>
        </footer>
        <script>
            (function () {
                'use strict';

                function pushCta(cta) {
                    window.dataLayer = window.dataLayer || [];
                    var payload = { event: 'cta_click', cta: cta };
                    window.dataLayer.push(payload);
                    console.info('[pzstudio] dataLayer push:', payload);
                }

                function fallbackCopy(text) {
                    var area = document.createElement('textarea');
                    area.value = text;
                    area.setAttribute('readonly', '');
                    area.style.position = 'fixed';
                    area.style.opacity = '0';
                    document.body.appendChild(area);
                    area.select();
                    try {
                        document.execCommand('copy');
                    } catch (err) {
                        /* clipboard unavailable - the command stays selectable */
                    }
                    document.body.removeChild(area);
                }

                function copyText(text, button) {
                    if (button._copyTimer) {
                        window.clearTimeout(button._copyTimer);
                    }
                    button.textContent = 'Copied!';
                    button._copyTimer = window.setTimeout(function () {
                        button.textContent = 'Copy';
                        button._copyTimer = null;
                    }, 1500);
                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text).catch(function () {
                            fallbackCopy(text);
                        });
                    } else {
                        fallbackCopy(text);
                    }
                }

                document
                    .getElementById('cta-marketplace')
                    .addEventListener('click', function () {
                        pushCta('marketplace');
                    });
                document
                    .getElementById('cta-npm')
                    .addEventListener('click', function () {
                        copyText('npm i @pzstudio/cli', this);
                        pushCta('npm');
                    });
                document
                    .getElementById('cta-npx')
                    .addEventListener('click', function () {
                        copyText('npx @pzstudio/cli --help', this);
                        pushCta('npm');
                    });
            })();
        </script>
    </body>
</html>
