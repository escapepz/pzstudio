packages:
    - 'packages/*'

overrides:
    picomatch: 2.3.2
    undici: 7.24.0
    lodash: 4.17.24
    esbuild: 0.28.2
    serialize-javascript: 7.1.4
    '@azure/msal-node': 7.2.1
    qs: 6.17.1
    glob: 14.0.4
    diff: 8.0.3
    vite: 8.3.7
    postcss: 8.5.32
    nanoid: 3.3.20
    source-map-js: 1.2.2
    minimatch: 11.0.6

# Exact pins are the manifest policy; make future `pnpm add` follow it.
saveExact: true

allowBuilds:
    '@parcel/watcher': true
    '@vscode/vsce-sign': true
    esbuild: true
    keytar: true
    lefthook: true
