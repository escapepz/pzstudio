<svg
  xmlns="http://www.w3.org/2000/svg"
  width="24"
  height="24"
  viewBox="0 0 24 24"
  fill="none"
>
  <!--
    PZ geometric monogram (24px activity-bar adaptation of the 256-unit
    brand construction): 45° chamfered P bowl interlocking with the Z
    diagonal, shared capline/baseline (y=4..20), uniform 3px strokes,
    crisp even-odd counter. No pixel/distressed artifacts.
  -->
  <path
    fill="currentColor"
    d="
      M2 4
      H8
      L11 7
      V10
      L8 13
      H5
      V20
      H2
      Z

      M5 7
      H8
      V10
      H5
      Z
    "
    fill-rule="evenodd"
    clip-rule="evenodd"
  />

  <path
    fill="currentColor"
    d="
      M13 4
      H22
      V7
      L17 17
      H22
      V20
      H13
      V17
      L18 7
      H13
      Z
    "
  />
</svg>
